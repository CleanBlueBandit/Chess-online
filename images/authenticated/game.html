<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/game.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/">Chess</a>
      <div class="nav-links">
        <a href="/dashboard">Play</a>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-block: var(--space-5)">
    <div class="game-layout">
      <section aria-label="Board">
        <div class="player-strip" id="strip-top">
          <div class="avatar" aria-hidden="true"></div>
          <div>
            <div class="player-name" id="name-top">Opponent</div>
            <div class="rating" id="rating-top"></div>
          </div>
          <div class="clock" id="clock-top">0:00</div>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Chess board"></div>
          <div class="promo" id="promo" hidden>
            <div class="promo-choices" id="promo-choices"></div>
          </div>
        </div>

        <div class="player-strip" id="strip-bottom">
          <div class="avatar" aria-hidden="true"></div>
          <div>
            <div class="player-name" id="name-bottom">You</div>
            <div class="rating" id="rating-bottom"></div>
          </div>
          <div class="clock" id="clock-bottom">0:00</div>
        </div>
      </section>

      <aside class="card side-panel">
        <div class="panel-header">Moves</div>
        <div class="move-list" id="moves"></div>

        <div class="side-body stack-sm">
          <div class="alert alert-warning" id="conn" role="status" hidden>Reconnecting…</div>
          <div class="alert" id="notice" role="status" hidden></div>
          <div class="alert alert-success" id="result" role="status" hidden></div>

          <div class="alert" id="draw-prompt" hidden>
            <p>Your opponent offers a draw.</p>
            <div class="row mt-4">
              <button class="btn btn-primary btn-sm" id="draw-accept" type="button">Accept draw</button>
              <button class="btn btn-sm" id="draw-decline" type="button">Decline</button>
            </div>
          </div>

          <div class="actions" id="actions">
            <button class="btn" id="btn-abort" type="button" hidden>Abort game</button>
            <button class="btn" id="btn-draw" type="button" hidden>Offer draw</button>
            <button class="btn btn-danger" id="btn-resign" type="button" hidden>Resign</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/src/game.js"></script>
</body>
</html>
